<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Driftworks - Games Hub</title>
  <meta name="description" content="A calm space trading game for short breaks: mine, trade and grow a company while you work." />
  <meta name="theme-color" content="#040a1d" />
  <link rel="icon" href="/games/driftworks/thumbnail.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" />
  <link rel="stylesheet" href="/shared/css/glass.css" />
  <link rel="stylesheet" href="/games/driftworks/style.css" />
</head>
<body>
  <div class="dw-app" id="app">
    <canvas id="map" class="dw-map" tabindex="0" role="img"
      aria-label="System map. Select a ship, then right-click or press and hold a field or station to give it orders, or use the panel and the Fleet view. Arrow keys pan, plus and minus zoom."></canvas>

    <header class="dw-top glass">
      <a class="dw-round glass-btn" href="/" aria-label="Back to Games Hub" title="Back to Games Hub">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5 5.5 9l5.5 5.5" /></svg>
      </a>
      <div class="dw-brand">
        <span class="dw-orb" aria-hidden="true"></span>
        <span class="dw-brand-text">
          <strong id="system-name">Aurel system</strong>
          <span class="dw-muted" id="system-sub">Halcyon Compact · home</span>
        </span>
      </div>
      <div class="dw-stats">
        <div class="dw-pill">
          <span class="dw-coin" aria-hidden="true"></span>
          <span class="dw-pill-text"><span class="dw-pill-label">Credits</span><strong id="credits">0</strong></span>
        </div>
        <div class="dw-pill dw-hide-phone">
          <span class="dw-pill-text"><span class="dw-pill-label">Fleet</span><strong id="fleet-summary">1 ship</strong></span>
        </div>
      </div>
      <div class="dw-next dw-hide-phone" id="next-chip">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="7" /><path d="M9 4.5V9l3 2" /></svg>
        <span id="next-text">All ships idle</span>
      </div>
      <button type="button" class="dw-round glass-btn" id="settings-btn" aria-label="Settings" title="Settings">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" /><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" /></svg>
      </button>
    </header>

    <aside id="panel" class="dw-panel glass" aria-label="Details" hidden></aside>

    <div class="dw-zoom" aria-label="Map zoom">
      <button type="button" class="dw-round glass-btn" data-zoom="in" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" class="dw-round glass-btn" data-zoom="out" aria-label="Zoom out" title="Zoom out">−</button>
      <button type="button" class="dw-round glass-btn" data-zoom="fit" aria-label="Show the whole system" title="Show the whole system">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" /></svg>
      </button>
    </div>

    <div class="dw-dock">
      <section id="underway" class="dw-underway glass" aria-label="Underway"></section>
      <nav class="dw-nav glass" aria-label="Views" id="nav">
        <button type="button" data-view="galaxy" aria-disabled="true" title="Arrives with the warp drive in the next update">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5.5" width="8" height="5.5" rx="1.4" /><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" /></svg>
          Galaxy
        </button>
        <button type="button" data-view="system">System</button>
        <button type="button" data-view="fleet">Fleet</button>
        <button type="button" data-view="research">Research</button>
        <button type="button" data-view="company">Company</button>
      </nav>
    </div>

    <section id="guide" class="dw-guide glass" aria-label="Tutorial" aria-live="polite" hidden></section>
    <div id="menu" class="dw-menu glass" role="dialog" aria-labelledby="menu-title" tabindex="-1" hidden></div>
    <div id="toasts" class="dw-toasts" role="status" aria-live="polite"></div>
    <dialog id="modal" class="dw-modal glass" aria-labelledby="modal-title"></dialog>
  </div>

  <noscript><p class="dw-noscript">Driftworks needs JavaScript to run.</p></noscript>
  <script type="module" src="/games/driftworks/main.js"></script>
</body>
</html>
