<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A collection of small, random web-based games you can play instantly in your browser." />
  <title>Games Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />

  <div class="bg-decor" aria-hidden="true">
    <div class="bg-blob bg-blob-a"></div>
    <div class="bg-blob bg-blob-b"></div>
    <div class="bg-blob bg-blob-c"></div>
    <div class="bg-aurora"></div>
    <div class="bg-grid"></div>
    <div class="bg-stars"></div>

    <p>A collection of small, random web-based games.</p>
  </header>

  <main>
    <section id="game-grid" class="game-grid" aria-live="polite">

      <div class="game-card skeleton"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div>
      <div class="game-card skeleton"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Games Hub</p>
