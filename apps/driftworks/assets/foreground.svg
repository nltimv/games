    <polygon transform="translate(335 689)" points="36,0 18,31 -18,31 -36,0 -18,-31 18,-31"/>
  </g>
  <circle cx="730" cy="640" r="26" fill="url(#ice)"/>
  <circle cx="762" cy="608" r="13" fill="url(#ice)"/>
  <!-- A ship on its way -->
  <path d="M618 406 Q 700 470 730 640" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="12 16"/>
  <path d="M676 490 l40 6 -30 24 z" fill="#d9fff8"/>
