# Default values for games-hub.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # -- Container image repository. Override with e.g.
  # `--set image.repository=ghcr.io/<owner>/<repo>` for your fork.
  repository: ghcr.io/OWNER/games-hub
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # -- Optional image digest (e.g. "sha256:abcdef...") to pin the exact image
  # content, appended to the tag as `repository:tag@digest`. Strongly
  # recommended when `tag` is a mutable value like "latest" or "main":
  # without a digest pin, `imagePullPolicy: IfNotPresent` can cause nodes to
  # keep serving a stale cached image even after the registry tag is updated,
  # since Kubernetes only checks whether that repo:tag string already exists
  # locally, not whether its content changed. Pinning a digest here (kept in
  # sync automatically by tools like Renovate, which understands this
  # `image.tag`/`image.digest` convention) makes every deploy immutable and
  # reproducible, and forces a real re-pull whenever it changes.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # Explicit numeric UID/GID matching the "app" user baked into the image
  # (see Dockerfile). Kubernetes cannot resolve non-numeric usernames to
  # verify runAsNonRoot, so this must be numeric.
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# The application listens on this port inside the container (see server.js / Dockerfile).
containerPort: 3000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: games-hub.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: games-hub-tls
    #   hosts:
    #     - games-hub.local

# We set light default resource requests/limits so the chart is usable out of the box,
# while remaining easy to override for your environment.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Extra environment variables for the container, e.g.:
# env:
#   - name: NODE_ENV
#     value: production
env: []

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: tmp
  #   emptyDir: {}

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: tmp
  #   mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}

# ---------------------------------------------------------------------------
# Cloud saves (player accounts and saves in PostgreSQL). Off by default: the
# hub then runs without a database and games save in the browser only.
# Needs a database: either the bundled one (postgresql.enabled) or your own
# server (externalDatabase). See the README section "Cloud saves".
# ---------------------------------------------------------------------------
cloudSaves:
  enabled: false
  # -- The pepper: the secret key that account numbers and recovery emails
  # are hashed with. It never goes into the database, so a database leak
  # alone exposes neither. LOSING IT LOCKS EVERY PLAYER OUT: back it up.
  # Leave existingSecret empty to have the chart generate one on first
  # install; it is kept on upgrades and on `helm uninstall`.
  pepper:
    existingSecret: ""
    key: pepper
  # -- Largest save accepted, in bytes.
  maxSaveBytes: 1048576
  # -- Proxy hops in front of the app (an ingress controller is one), so
  # rate limits see the player's address. Set to "false" when nothing
  # proxies the app.
  trustProxy: "1"
  # -- Sends the session cookie only over HTTPS. Set to false only for a
  # plain-HTTP test install.
  secureCookie: true

# -- A single PostgreSQL instance deployed with the chart (a StatefulSet with
# the official postgres image and a persistent volume).
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: games
    username: games
    # -- Secret with the password under passwordKey. Leave empty to have
    # the chart generate one (kept on upgrades).
    existingSecret: ""
    passwordKey: password
  persistence:
    size: 1Gi
    # -- "" uses the cluster's default storage class.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Your own PostgreSQL server, used when postgresql.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  database: games
  username: games
  # -- Secret holding the password (required for an external database).
  existingSecret: ""
  passwordKey: password
  # -- disable, require (encrypted, certificate not checked) or verify-full.
  sslMode: disable

# -- Mail for account recovery. Without it, recovery is hidden from players.
mail:
  enabled: false
  host: ""
  port: 587
  # -- true for implicit TLS (usually port 465); STARTTLS is used otherwise when offered.
  secure: false
  from: "Games Hub <noreply@example.com>"
  # -- Secret with the SMTP login under usernameKey and passwordKey. Leave
  # empty for a server that needs no login.
  existingSecret: ""
  usernameKey: username
  passwordKey: password
