{{- include "games-hub.validateCloudSaves" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "games-hub.fullname" . }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "games-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "games-hub.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "games-hub.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $tag := .Values.image.tag | default .Chart.AppVersion }}
          image: "{{ .Values.image.repository }}:{{ $tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if or .Values.env .Values.cloudSaves.enabled }}
          env:
            {{- if .Values.cloudSaves.enabled }}
            - name: CLOUD_SAVES
              value: "true"
            - name: CLOUD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "games-hub.pepperSecretName" . }}
                  key: {{ .Values.cloudSaves.pepper.key }}
            - name: MAX_SAVE_BYTES
              value: {{ .Values.cloudSaves.maxSaveBytes | int | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.cloudSaves.trustProxy | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.cloudSaves.secureCookie | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: PGHOST
              value: {{ include "games-hub.postgresqlName" . }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgresql.auth.username | quote }}
            {{- else }}
            - name: PGHOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: PGPORT
              value: {{ .Values.externalDatabase.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.externalDatabase.database | quote }}
            - name: PGUSER
              value: {{ .Values.externalDatabase.username | quote }}
            - name: DB_SSL
              value: {{ .Values.externalDatabase.sslMode | quote }}
            {{- end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "games-hub.databaseSecretName" . }}
                  key: {{ include "games-hub.databasePasswordKey" . }}
            {{- if .Values.mail.enabled }}
            - name: SMTP_HOST
              value: {{ .Values.mail.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.mail.port | quote }}
            - name: SMTP_SECURE
              value: {{ .Values.mail.secure | quote }}
            - name: MAIL_FROM
              value: {{ .Values.mail.from | quote }}
            {{- if .Values.mail.existingSecret }}
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret }}
                  key: {{ .Values.mail.usernameKey }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret }}
                  key: {{ .Values.mail.passwordKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
