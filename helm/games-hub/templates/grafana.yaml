{{- /*
Grafana with the usage data dashboards (docs/analytics.md). It reads the
events table through a read-only login (telemetry.reader) that the app
creates on start. The dashboards are the JSON files in dashboards/, loaded
from a ConfigMap, so they follow the chart.
*/ -}}
{{- if and .Values.telemetry.enabled .Values.grafana.enabled }}
{{- if not .Values.telemetry.reader.existingSecret }}
{{- $name := include "games-hub.readerSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index ($existing.data | default dict) .Values.telemetry.reader.passwordKey | default "" }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics
type: Opaque
data:
  {{ .Values.telemetry.reader.passwordKey }}: {{ $password | quote }}
---
{{- end }}
{{- end }}
{{- if and .Values.telemetry.enabled .Values.grafana.enabled }}
{{- $name := include "games-hub.grafanaName" . }}
{{- if not .Values.grafana.admin.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index ($existing.data | default dict) .Values.grafana.admin.passwordKey | default "" }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
data:
  {{ .Values.grafana.admin.passwordKey }}: {{ $password | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-provisioning
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Games Hub
        uid: games-db
        type: grafana-postgresql-datasource
        access: proxy
        isDefault: true
        editable: false
        {{- if .Values.postgresql.enabled }}
        url: {{ include "games-hub.postgresqlName" . }}:5432
        user: {{ .Values.telemetry.reader.username }}
        jsonData:
          database: {{ .Values.postgresql.auth.database }}
          sslmode: disable
        {{- else }}
        url: {{ .Values.externalDatabase.host }}:{{ .Values.externalDatabase.port }}
        user: {{ .Values.telemetry.reader.username }}
        jsonData:
          database: {{ .Values.externalDatabase.database }}
          sslmode: {{ .Values.externalDatabase.sslMode }}
        {{- end }}
          postgresVersion: 1500
          timescaledb: false
        secureJsonData:
          password: $__env{READER_PASSWORD}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Games Hub
        folder: Games Hub
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboards
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
{{- if .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.grafana.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "games-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "games-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        # Restart when the dashboards or the data source change.
        {{- $dashboards := "" }}
        {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
        {{- $dashboards = print $dashboards ($.Files.Get $path) }}
        {{- end }}
        checksum/dashboards: {{ $dashboards | sha256sum }}
        checksum/provisioning: {{ printf "%s%s%s" .Values.postgresql.enabled .Values.externalDatabase.host .Values.telemetry.reader.username | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.admin.user | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "games-hub.grafanaSecretName" . }}
                  key: {{ .Values.grafana.admin.passwordKey }}
            - name: READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "games-hub.readerSecretName" . }}
                  key: {{ .Values.telemetry.reader.passwordKey }}
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            - name: GF_PATHS_LOGS
              value: /var/lib/grafana/logs
            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_LOG_MODE
              value: console
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Grafana phones home by default; this one does not.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            # No plugin downloads: the dashboards need only built-in panels.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana-dashboards/overview.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: provisioning
          configMap:
            name: {{ $name }}-provisioning
        - name: dashboards
          configMap:
            name: {{ $name }}-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "games-hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- if .Values.grafana.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.grafana.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.grafana.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.grafana.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.grafana.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
