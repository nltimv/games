{{- if .Values.cloudSaves.enabled }}
{{- if not .Values.cloudSaves.pepper.existingSecret }}
{{- $name := include "games-hub.pepperSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pepper := "" }}
{{- if $existing }}
{{- $pepper = index ($existing.data | default dict) .Values.cloudSaves.pepper.key | default "" }}
{{- end }}
{{- if not $pepper }}
{{- $pepper = randAlphaNum 64 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
  annotations:
    # Losing the pepper locks every player out: never delete it with the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.cloudSaves.pepper.key }}: {{ $pepper | quote }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "games-hub.postgresqlName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index ($existing.data | default dict) .Values.postgresql.auth.passwordKey | default "" }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "games-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # The data volume keeps this password: keep the Secret with it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.postgresql.auth.passwordKey }}: {{ $password | quote }}
{{- end }}
{{- end }}
