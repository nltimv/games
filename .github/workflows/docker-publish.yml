name: Build and Publish

# Lint, test, and build on every pull request and push to main. Images and
# the Helm chart are only published, and a GitHub release only created, when
# a vX.Y.Z tag is pushed on a commit that is on main. The version comes from
# the tag; package.json and Chart.yaml keep a 0.0.0-dev placeholder.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: ver
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          scripts/release-version.sh "$GITHUB_REF" "$GITHUB_SHA" origin/main | tee -a "$GITHUB_OUTPUT"

  build-and-push:
    name: Build (and on release, push) Docker image
    needs: [check, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ needs.version.outputs.release }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release tags only: X.Y.Z, plus X.Y, X and latest for non-prerelease
          # versions. Non-release runs build with the placeholder tag and
          # never push.
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ env.RELEASE == 'true' }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ env.RELEASE == 'true' }}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' && needs.version.outputs.prerelease == 'false' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.RELEASE == 'true' }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  package-and-push-chart:
    name: Package (and on release, push) Helm chart
    needs: [check, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ needs.version.outputs.release }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/games-hub

      - name: Package chart
        run: |
          mkdir -p dist
          helm package helm/games-hub \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/games-hub-${{ env.VERSION }}.tgz
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        if: env.RELEASE == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR
        if: env.RELEASE == 'true'
        run: |
          helm push "dist/games-hub-${VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm"

  release:
    name: Create GitHub release
    needs: [version, build-and-push, package-and-push-chart]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download chart package
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist

      - name: Create release
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          chart="oci://${REGISTRY}/${{ github.repository_owner }}/helm/games-hub"
          cat > notes.md <<EOF
          ## Install

          - Image: \`${image}\`
          - Helm chart: \`helm upgrade --install games-hub ${chart} --version ${VERSION} --set image.repository=${REGISTRY}/${IMAGE_NAME}\`
          EOF
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "dist/games-hub-${VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
